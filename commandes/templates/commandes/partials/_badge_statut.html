{% if statut == 'en_attente' %}
<span class="px-3 py-1 text-xs font-semibold bg-amber-100 text-amber-700 rounded-full">En attente</span>
{% elif statut == 'en_cours' %}
<span class="px-3 py-1 text-xs font-semibold bg-blue-100 text-blue-700 rounded-full">En cours</span>
{% elif statut == 'termine' %}
<span class="px-3 py-1 text-xs font-semibold bg-green-100 text-green-700 rounded-full">Terminée</span>
{% else %}
<span class="px-3 py-1 text-xs font-semibold bg-rose-100 text-rose-700 rounded-full">Annulée</span>
{% endif %}
