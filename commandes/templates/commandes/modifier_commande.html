{% extends "base/base.html" %}
{% block content %}
<section class="max-w-3xl mx-auto py-12 px-6">
  <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-6">
    Modifier la commande {{ commande.code_commande }}
  </h2>

  <div class="bg-white dark:bg-slate-900 p-6 rounded-xl border border-slate-200 dark:border-slate-800 shadow">
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Adresse de livraison</label>
        <input type="text" name="adresse" value="{{ commande.adresse }}" 
               class="w-full rounded-md border-slate-300 dark:border-slate-700 dark:bg-slate-800">
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Notes du client</label>
        <textarea name="notes_client" rows="3" 
                  class="w-full rounded-md border-slate-300 dark:border-slate-700 dark:bg-slate-800">{{ commande.notes_client }}</textarea>
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Mode de paiement</label>
        <select name="mode_paiement" 
                class="w-full rounded-md border-slate-300 dark:border-slate-700 dark:bg-slate-800">
          {% for key, label in commande.MODES_PAIEMENT %}
            <option value="{{ key }}" {% if commande.mode_paiement == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="flex justify-end gap-4">
        <a href="{% url 'commandes:mes_commandes' %}" class="px-4 py-2 bg-slate-200 rounded-md hover:bg-slate-300">Annuler</a>
        <button type="submit" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90">
          Enregistrer les modifications
        </button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
