{% extends "base/base.html" %}
{% block title %}Paiement de la commande{% endblock %}

{% block content %}
<section class="max-w-lg mx-auto py-12 px-6 text-center">
  <h1 class="text-2xl font-bold mb-6">💳 Paiement de votre commande</h1>
  <p class="mb-4 text-lg">
    Montant à payer : <strong>{{ montant }} FCFA</strong><br>
    Mode de paiement choisi : <strong>{{ mode|capfirst }}</strong>
  </p>

  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="bg-primary text-white px-8 py-3 rounded-lg font-semibold hover:bg-primary/90">
      ✅ Confirmer le paiement
    </button>
  </form>
</section>
{% endblock %}
