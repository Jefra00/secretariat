{% extends "base/base1.html" %}
{% block title %}Nouvelle entreprise{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto py-10 px-6">
  <div class="bg-white dark:bg-slate-900 rounded-lg p-6 shadow">
    <h1 class="text-2xl font-bold mb-4">➕ Ajouter une entreprise</h1>
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <input type="text" name="nom" placeholder="Nom de l’entreprise" class="w-full border rounded p-2" required>
        <input type="text" name="secteur" placeholder="Secteur d’activité" class="w-full border rounded p-2" required>
        <input type="email" name="email" placeholder="Email de contact" class="w-full border rounded p-2" required>
        <input type="text" name="telephone" placeholder="Téléphone" class="w-full border rounded p-2" required>
        <input type="text" name="site_web" placeholder="Site web (optionnel)" class="w-full border rounded p-2">
        <textarea name="adresse" placeholder="Adresse complète" class="w-full border rounded p-2"></textarea>
      </div>
      <div class="mt-6 flex justify-end gap-3">
        <a href="{% url 'company:company_list' %}" class="text-slate-500 hover:underline">Annuler</a>
        <button type="submit" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary/90">Enregistrer</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
