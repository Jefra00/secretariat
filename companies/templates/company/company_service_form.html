{% extends "base/base1.html" %}
{% block title %}Ajouter un service — {{ company.nom }}{% endblock %}

{% block content %}
<section class="max-w-3xl mx-auto py-10 px-6">
  <div class="bg-white dark:bg-slate-900 rounded-lg p-6 shadow">
    <h1 class="text-2xl font-bold mb-4">Ajouter un service pour {{ company.nom }}</h1>

    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <label>Service</label>
        <select name="service" class="w-full border rounded p-2">
          {% for s in services %}
            <option value="{{ s.id }}">{{ s.nom }}</option>
          {% endfor %}
        </select>

        <input type="text" name="forfait" placeholder="Nom du forfait (ex: Premium)" class="w-full border rounded p-2">
        <input type="number" step="0.01" name="tarif" placeholder="Tarif personnalisé (€)" class="w-full border rounded p-2">
        <textarea name="description" placeholder="Description du forfait" class="w-full border rounded p-2"></textarea>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <a href="{% url 'company:company_detail' company.id %}" class="text-slate-500 hover:underline">Annuler</a>
        <button type="submit" class="bg-primary text-white px-4 py-2 rounded hover:bg-primary/90">Ajouter</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
