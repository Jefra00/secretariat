{% extends "base/base1.html" %}
{% block title %}Abonnement{% endblock %}

{% block content %}
<section class="max-w-md mx-auto py-12 px-6 text-center">
  <h1 class="text-3xl font-bold text-primary mb-4">📩 Abonnez-vous à notre newsletter</h1>
  <p class="text-slate-500 mb-6">Recevez nos actualités, offres et conseils directement dans votre boîte mail.</p>

  <form method="POST" class="space-y-4">
    {% csrf_token %}
    <input type="text" name="nom" placeholder="Votre nom (facultatif)" class="w-full p-3 border rounded-md dark:bg-slate-800">
    <input type="email" name="email" required placeholder="Votre adresse e-mail" class="w-full p-3 border rounded-md dark:bg-slate-800">
    <button type="submit" class="bg-primary text-white px-5 py-2 rounded-md font-semibold hover:bg-primary/90 transition">
      ✅ Je m’abonne
    </button>
  </form>
</section>
{% endblock %}
